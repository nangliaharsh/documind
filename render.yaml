services:
  - type: web
    name: documind-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: CHROMA_DB_PATH
        value: ./data/chromadb
      - key: UPLOAD_PATH
        value: ./data/uploads